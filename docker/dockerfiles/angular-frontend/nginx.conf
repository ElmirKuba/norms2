# nginx для SPA Angular: любая неизвестная маршрутом ссылка отдаёт index.html
# (history API роутинга), статика кэшируется. Проксирование /api — на бэкенд
# в проде делает Traefik (см. docker-compose.prod.yml), не nginx.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # History-fallback: SPA сама разбирает путь.
  #
  # `$uri/` здесь НЕТ намеренно (2.9.3, после 403 на проде). С ним nginx пытался отдать
  # каталог: пока в public/ не было папки releases/, путь /releases/ спокойно уходил в SPA,
  # а как только там появились лендинги — каталог начал совпадать, листинг запрещён, и
  # человек получал 403 Forbidden вместо витрины релизов.
  #
  # Цена: каталог со своим index.html больше не откроется по пути с завершающим слэшем.
  # У нас таких нет — статические страницы отдаются явными адресами вида
  # /releases/release-2.9.2.html, а всё остальное разбирает Angular.
  location / {
    try_files $uri /index.html;
  }

  # Долгий кэш для хэшированных ассетов.
  location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico|webp)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
