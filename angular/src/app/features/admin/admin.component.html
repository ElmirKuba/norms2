<section class="admin">
  <header class="admin__head">
    <h1 class="admin__title">Админка</h1>
    <p class="admin__hint">
      Техническая. Нужна, чтобы не заходить на сервер по ssh ради переключения флага.
    </p>
  </header>

  <nav class="admin__tabs" aria-label="Разделы админки" appHscrollHint [appHscrollHintDelay]="1300">
    <a class="admin__tab" routerLink="settings" routerLinkActive="admin__tab--on">Настройки</a>
    <a class="admin__tab" routerLink="people" routerLinkActive="admin__tab--on">Люди и роли</a>
    <a class="admin__tab" routerLink="requests" routerLinkActive="admin__tab--on">Заявки</a>
    <a class="admin__tab" routerLink="releases" routerLinkActive="admin__tab--on">Релизы</a>
    <a class="admin__tab" routerLink="state" routerLinkActive="admin__tab--on">Состояние</a>
    <a class="admin__tab" routerLink="journal" routerLinkActive="admin__tab--on">Журнал</a>
  </nav>

  <router-outlet />
</section>
